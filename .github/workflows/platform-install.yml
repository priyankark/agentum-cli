name: Windows, macOS and Linux installation
on:
  push:
    branches: [fix/agentum-1.0.3, feature/agentum-desktop-controls]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify Windows listener and PTY lifecycle
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: |
          npm run build
          node tests/server.test.cjs
      - run: npm test
      - run: npm run test:package
